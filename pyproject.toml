[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gym-substrate"
version = "0.1.0"
description = "NeMo Gym sandbox provider for Agent Substrate, with the in-actor agent it talks to"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13.14"
# nemo-gym is not listed: the plugin only runs inside a Gym venv, which has it,
# and a Gym server venv that installs the plugin through head_server_deps cannot
# resolve a second nemo-gym next to the checkout's own.
dependencies = [
    "grpcio>=1.81.0",
    "protobuf>=6.33.5",
    "httpx>=0.27",
    "kubernetes>=30",
    "PyYAML>=6.0",
]

[project.entry-points."nemo_gym.sandbox_providers"]
substrate = "gym_substrate.provider:SubstrateProvider"

[project.urls]
Repository = "https://github.com/dims/gym-substrate"

[dependency-groups]
dev = ["nemo-gym", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.uv.sources]
nemo-gym = { git = "https://github.com/NVIDIA-NeMo/Gym.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["gym_substrate"]

[tool.ruff]
line-length = 119
target-version = "py313"
# Generated stubs import dependency protos for their registration side effect.
extend-exclude = ["gym_substrate/_ateapi"]
force-exclude = true

[tool.ruff.lint]
select = ["F541", "F841", "F401", "E741", "F821", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
