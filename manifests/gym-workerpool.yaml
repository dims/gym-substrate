# Eight cpu 1 / 4Gi actors per worker; templates made with WORKLOAD=gym select it.
# Set workerImage to the install's gVisor worker image (docs/provider.md, Cluster). For the
# micro-VM class set sandboxClasses to microvm, use that class's worker image and make the
# memory request equal to the limit; hack/kind-up.sh renders both forms.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: gym-workerpool
  namespace: ate-demo-sandbox
  labels:
    workload: gym
spec:
  replicas: 3
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "8"
        memory: 32Gi
      requests:
        cpu: "1"
        memory: 16Gi
  workerImage: WORKER_IMAGE
