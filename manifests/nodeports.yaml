# The API and the router on every node: <node ip>:30443 (gRPC over TLS) and :30080 (HTTP).
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: ate-system
spec:
  type: NodePort
  selector:
    app: ate-api-server
  ports:
  - name: grpc
    port: 443
    targetPort: 443
    nodePort: 30443
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router-nodeport
  namespace: ate-system
spec:
  type: NodePort
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
