# The API, the router and Prometheus on every node: <node ip>:30443 (gRPC over TLS), :30080 (HTTP)
# and :30090 (the kind install's Prometheus, so a monitor reads metrics when sshd is starved).
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: ate-system
spec:
  type: NodePort
  selector:
    app: ate-api-server
  ports:
  - name: grpc
    port: 443
    targetPort: 443
    nodePort: 30443
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router-nodeport
  namespace: ate-system
spec:
  type: NodePort
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: otel-system
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: web
    port: 9090
    targetPort: web
    nodePort: 30090
